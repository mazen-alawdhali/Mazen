<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مساعد النشر - Post Helper</title>
  
  <meta name="theme-color" content="#18191A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مساعد النشر">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📢</text></svg>">

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- مكتبات Firebase السحابية -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 15px;
      background-color: #18191A; 
      color: #E4E6EB; 
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .app-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; }
    h2 { text-align: center; color: #4599FF; margin: 0 0 10px 0; font-weight: 700; }
    
    .card { background: #242526; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; box-sizing: border-box; border: 1px solid #333; }
    .card h3 { margin: 0 0 10px 0; font-size: 16px; color: #E4E6EB; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; width: 100%; }
    .toolbar button { flex: 1; background-color: #3A3B3C; color: #E4E6EB; border: 1px solid #555; padding: 8px 2px; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 12px; white-space: nowrap; text-align: center; transition: background 0.2s; }
    .toolbar button:active { background-color: #555; }
    .toolbar button:hover { background-color: #4A4B4C; }

    #postEditor { width: 100%; min-height: 100px; padding: 12px; background-color: #3A3B3C; color: #E4E6EB; border: 1px solid #555; border-radius: 8px; margin-bottom: 10px; font-size: 15px; outline: none; box-sizing: border-box; font-family: inherit; resize: none; overflow: hidden; }
    #postEditor:focus { border-color: #4599FF; }
    #postEditor::placeholder { color: #B0B3B8; }
    
    .actions-row { display: flex; gap: 10px; width: 100%; }
    .btn-copy { flex: 1; background: #31A24C; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 700; font-family: inherit; transition: 0.3s; text-align: center; }
    .btn-copy.copied { background: #2b8f42; }
    
    .btn-clear { flex: 1; background: #3A3B3C; color: #E4E6EB; border: 1px solid #555; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 700; font-family: inherit; transition: 0.2s; text-align: center; }
    .btn-clear:hover { background: #E41E3F; border-color: #E41E3F; color: white; }

    .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .input-group input { width: 100%; padding: 12px; background-color: #3A3B3C; color: #E4E6EB; border: 1px solid #555; border-radius: 8px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
    .input-group input::placeholder { color: #B0B3B8; }
    #newLink { text-align: center; }
    #newLink:focus { text-align: left; direction: ltr; }

    .btn-add { background: #2374E1; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 15px; width: 100%; font-family: inherit; }

    .backup-row { display: flex; gap: 10px; margin-top: 10px; }
    .btn-backup { flex: 1; background: #2D3748; color: #E4E6EB; border: 1px solid #4A5568; padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; text-align: center; transition: 0.2s; }
    .btn-backup:hover { background: #4A5568; }

    .controls-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    #progressCounter { font-size: 14px; font-weight: 700; color: #B0B3B8; }
    #progressCounter span { color: #31A24C; font-size: 16px; }
    
    .btn-reset { background: #3A3B3C; color: #E4E6EB; border: 1px solid #555; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; transition: 0.2s; }
    .btn-reset:hover { background: #E41E3F; border-color: #E41E3F; color: white; }
    
    #searchInput { width: 100%; padding: 10px 12px; background-color: #3A3B3C; color: #E4E6EB; border: 1px solid #555; border-radius: 8px; font-size: 14px; box-sizing: border-box; font-family: inherit; margin-bottom: 12px; outline: none; }
    #searchInput:focus { border-color: #4599FF; }
    
    .filter-tabs { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
    .filter-tabs button { flex: 1; background-color: #3A3B3C; color: #B0B3B8; border: 1px solid #555; padding: 8px 4px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: bold; transition: 0.3s; white-space: nowrap; text-align: center; }
    .filter-tabs button.active { background-color: #2374E1; color: white; border-color: #2374E1; }

    .group-item { display: flex; flex-direction: column; padding: 15px 0; border-bottom: 1px solid #3E4042; gap: 12px; }
    .group-item:last-child { border-bottom: none; padding-bottom: 0; }
    
    .group-favorite { cursor: pointer; font-size: 22px; color: #F6B024; user-select: none; padding: 4px 8px; border-radius: 6px; transition: background 0.2s; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
    .group-favorite:active { background: rgba(246, 176, 36, 0.2); }
    
    .group-item.favorite { background-color: rgba(246, 176, 36, 0.08); border-radius: 8px; padding: 15px 10px; border-bottom: none; }
    
    .group-item.done { opacity: 0.5; background-color: #1c2b20; border-radius: 8px; padding: 15px 10px; border-bottom: none; }
    .group-item.done.favorite { background-color: rgba(28, 43, 32, 0.8); opacity: 0.6; }

    .group-info { display: flex; align-items: flex-start; gap: 10px; width: 100%; }
    .group-num { color: #B0B3B8; font-size: 14px; font-weight: 700; min-width: 15px; margin-top: 4px; }
    
    input[type="checkbox"] { transform: scale(1.4); margin: 6px 5px 0 5px; cursor: pointer; accent-color: #31A24C; flex-shrink: 0; }
    .group-name { font-size: 15px; font-weight: 600; color: #E4E6EB; word-break: break-word; line-height: 1.5; flex: 1; margin-top: 1px; }
    
    .group-actions { display: flex; gap: 10px; padding-right: 70px; }
    .btn-open, .btn-delete { flex: 1; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; text-align: center; }
    .btn-open { background: #2374E1; }
    .btn-delete { background: #E41E3F; }

    .btn-top { background: #3A3B3C; color: #E4E6EB; border: 1px solid #555; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 700; width: 100%; font-family: inherit; transition: 0.3s; margin-top: 5px; text-align: center; }
    .btn-top:hover { background: #4599FF; color: white; border-color: #4599FF; }

    .custom-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(3px);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999;
      opacity: 0; animation: fadeIn 0.2s forwards;
    }
    .custom-modal {
      background: #242526; border: 1px solid #38393A;
      width: 85%; max-width: 380px; padding: 22px;
      border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center; font-family: 'Cairo', sans-serif;
      transform: scale(0.9); animation: scaleUp 0.2s forwards;
    }
    .custom-modal-title {
      font-size: 17px; font-weight: 700; color: #E4E6EB;
      margin-bottom: 12px; line-height: 1.5;
    }
    .custom-modal-buttons {
      display: flex; gap: 10px; margin-top: 20px;
    }
    .custom-modal-btn {
      flex: 1; padding: 11px; border-radius: 8px; font-size: 14px;
      font-weight: 700; cursor: pointer; font-family: inherit; border: none;
      transition: 0.2s;
    }
    .modal-btn-cancel {
      background: #3A3B3C; color: #E4E6EB; border: 1px solid #555;
    }
    .modal-btn-cancel:hover { background: #4A4B4C; }
    .modal-btn-confirm {
      background: #E41E3F; color: white;
    }
    .modal-btn-confirm:hover { background: #c51633; }

    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes scaleUp { to { transform: scale(1); } }

    .app-footer { text-align: center; padding: 15px 0 5px 0; color: #B0B3B8; font-size: 13px; border-top: 1px solid #2F3031; margin-top: 10px; }
    .app-footer a { text-decoration: none; }
    .app-footer strong { color: #4599FF; font-weight: 700; transition: color 0.3s ease; }
    .app-footer a:hover strong { color: #2374E1; }
  </style>
</head>
<body>

  <div class="app-container">
    <h2 id="topAnchor">مساعد النشر 📢</h2>

    <!-- كارت كتابة المنشور -->
    <div class="card">
      <div class="toolbar">
        <button onclick="formatText('【 ', ' 】')" title="عنوان مؤطر">【 عنوان 】</button>
        <button onclick="insertSeparator()" title="سطر فاصل">══ فاصل</button>
        <button onclick="formatText('🔹 ', '')" title="نقطة قائمة">🔹 نقطة</button>
        <button onclick="formatText('✅ ', '')" title="صح">✅ تم</button>
      </div>

      <textarea id="postEditor" placeholder="اكتب نص المنشور هنا... (سيتم حفظه تلقائياً)" oninput="savePostText(); autoResize(this)"></textarea>
      
      <div class="actions-row">
        <button class="btn-copy" id="copyBtn" onclick="copyText()">📋 نسخ المنشور</button>
        <button class="btn-clear" onclick="clearText()">🗑️ إزالة النص</button>
      </div>
    </div>

    <!-- كارت إضافة المجموعات -->
    <div class="card">
      <h3 style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span>إضافة مجموعة جديدة</span>
        <span id="totalGroupsBadge" style="display: inline-flex; align-items: center; gap: 6px; background: rgba(69, 153, 255, 0.2); padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; border: 1px solid rgba(69, 153, 255, 0.4); direction: ltr;">
          <svg style="width: 18px; height: 18px; fill: #4599FF;" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          <span id="groupsCountNum" style="color: #FFFFFF;">0</span>
        </span>
      </h3>
      <div class="input-group">
        <input type="url" id="newLink" placeholder="...الصق رابط المجموعة هنا..." dir="ltr" onfocus="this.select()">
        <input type="text" id="newName" placeholder="اسم المجموعة..." onfocus="this.select()">
      </div>
      <button class="btn-add" onclick="addNewGroup()">➕ إضافة إلى القائمة</button>

      <div class="backup-row">
        <button class="btn-backup" onclick="exportData()">💾 تصدير المجموعات</button>
        <button class="btn-backup" onclick="triggerImport()">📂 استيراد المجموعات</button>
        <input type="file" id="importFile" style="display:none" accept=".json,application/json,text/plain" onchange="importData(event)">
      </div>
    </div>

    <!-- كارت البحث والفلترة -->
    <div class="card">
      <div class="controls-header">
        <div id="progressCounter">إنجاز: <span>0</span> / 0</div>
        <button class="btn-reset" onclick="resetProgress()">🔄 إعادة تعيين الكل</button>
      </div>
      
      <input type="text" id="searchInput" placeholder="🔍 ابحث عن اسم المجموعة..." oninput="renderList()">
      
      <div class="filter-tabs">
        <button id="tab-all" class="active" onclick="setFilter('all')">الكل</button>
        <button id="tab-fav" onclick="setFilter('fav')">⭐ المفضلة</button>
        <button id="tab-todo" onclick="setFilter('todo')">⏳ قيد الانتظار</button>
      </div>
    </div>

    <!-- كارت قائمة المجموعات -->
    <div class="card" id="groupsList">
      <!-- سيتم إدراج المجموعات هنا -->
    </div>
    
    <button class="btn-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">⬆️ العودة لأعلى الصفحة</button>

    <div class="app-footer">
      جميع الحقوق محفوظة © <span id="currentYear"></span> | تطوير: <a href="https://www.facebook.com/share/1FwEecrEPq/" target="_blank" rel="noopener noreferrer"><strong>م. مازن العوذلي</strong></a>
    </div>
  </div>

  <script>
    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
      apiKey: "AIzaSyA89DKwcT9Kke59BdpFR5MgE-iQFYF7k6Q",
      authDomain: "posthelperpro.firebaseapp.com",
      projectId: "posthelperpro",
      storageBucket: "posthelperpro.firebasestorage.app",
      messagingSenderId: "867686946998",
      appId: "1:867686946998:web:4660f6531f9b089ad0ae17",
      measurementId: "G-Y6BHWKVJJL"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let groups = [];
    let currentFilter = 'all';

    // جلب البيانات من سحابة Firebase عند تحميل الصفحة
    function loadGroupsFromCloud() {
      db.collection("groupsData").doc("mainList").get().then((doc) => {
        if (doc.exists) {
          groups = doc.data().items || [];
          renderList();
        } else {
          groups = [];
          renderList();
        }
      }).catch((error) => {
        console.error("خطأ في جلب البيانات:", error);
        // التراجع للذاكرة المحلية في حال انقطاع النت
        groups = JSON.parse(localStorage.getItem('solarGroupsList')) || [];
        renderList();
      });
    }

    // حفظ البيانات في سحابة Firebase والمحلية كاحتياط
    function saveGroupsData() {
      localStorage.setItem('solarGroupsList', JSON.stringify(groups));
      db.collection("groupsData").doc("mainList").set({
        items: groups
      }).catch((error) => {
        console.error("خطأ في الحفظ السحابي:", error);
      });
    }

    function formatText(startTag, endTag) {
      const textarea = document.getElementById('postEditor');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const selectedText = text.substring(start, end);
      
      textarea.value = text.substring(0, start) + startTag + selectedText + endTag + text.substring(end);
      textarea.focus();
      
      const newCursorPos = start + startTag.length + selectedText.length;
      textarea.selectionStart = textarea.selectionEnd = newCursorPos;

      savePostText(); 
      autoResize(textarea);
    }

    function insertSeparator() {
      const textarea = document.getElementById('postEditor');
      const start = textarea.selectionStart;
      const text = textarea.value;
      const separator = "\n═══════════════════════\n";
      textarea.value = text.substring(0, start) + separator + text.substring(start);
      textarea.focus();
      textarea.selectionStart = textarea.selectionEnd = start + separator.length;
      savePostText(); autoResize(textarea);
    }

    function autoResize(element) { element.style.height = 'auto'; element.style.height = (element.scrollHeight + 2) + 'px'; }

    function savePostText() { localStorage.setItem('savedPostText', document.getElementById('postEditor').value); }
    
    function copyText() {
      const textarea = document.getElementById('postEditor');
      const copyBtn = document.getElementById('copyBtn');
      if (!textarea.value.trim()) return alert('المنشور فارغ!');
      navigator.clipboard.writeText(textarea.value).then(() => {
        copyBtn.innerHTML = '✔️ تم النسخ بنجاح!'; copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.innerHTML = '📋 نسخ المنشور'; copyBtn.classList.remove('copied'); }, 2000);
      }).catch(err => { alert('فشل النسخ تلقائياً، يرجى النسخ يدوياً.'); });
    }

    function clearText() {
      const textarea = document.getElementById('postEditor');
      if (textarea.value.length === 0) return;
      showCustomConfirm('هل أنت متأكد من إزالة نص المنشور الحالي؟', () => {
        textarea.value = ''; savePostText(); autoResize(textarea); textarea.focus();
      });
    }

    function exportData() {
      if (groups.length === 0) return alert('القائمة فارغة لتصديرها!');
      const blob = new Blob([JSON.stringify(groups, null, 2)], { type: "application/json" });
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", URL.createObjectURL(blob));
      downloadAnchor.setAttribute("download", "groups_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImport() { document.getElementById('importFile').click(); }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          let fileContent = e.target.result || '';
          if (fileContent.includes('data:')) fileContent = fileContent.substring(fileContent.indexOf(',') + 1);
          if (fileContent.includes('%5B')) { try { fileContent = decodeURIComponent(fileContent); } catch(e){} }
          const arrStart = fileContent.indexOf('['), arrEnd = fileContent.lastIndexOf(']');
          if (arrStart === -1 || arrEnd === -1) throw new Error('الملف معطوب');
          const imported = JSON.parse(fileContent.substring(arrStart, arrEnd + 1));
          
          if (Array.isArray(imported)) {
            showCustomConfirm(`تم العثور على ${imported.length} مجموعة.\nهل تريد استبدال القائمة الحالية؟\n(موافق = استبدال | إلغاء = دمج)`, () => {
              groups = imported;
              saveGroupsData(); renderList(); alert('تم الاستيراد والحفظ السحابي بنجاح!');
            }, () => {
              imported.forEach(impGroup => {
                if (!groups.some(g => g.link.toLowerCase() === impGroup.link.toLowerCase())) groups.push(impGroup);
              });
              saveGroupsData(); renderList(); alert('تم دمج المجموعات والحفظ السحابي بنجاح!');
            });
          } else alert('ملف غير صالح!');
        } catch (err) { alert('حدث خطأ أثناء قراءة الملف.'); }
      };
      reader.onloadend = function() { document.getElementById('importFile').value = ''; };
      reader.readAsText(file);
    }

    function addNewGroup() {
      const linkInput = document.getElementById('newLink');
      const nameInput = document.getElementById('newName');
      let link = linkInput.value.trim();
      const name = nameInput.value.trim() || 'اسم المجموعة';

      if (!link) return alert('الرجاء إدخال رابط المجموعة أولاً.');
      if (!link.startsWith('http')) link = 'https://' + link;

      if (groups.some(group => group.link.toLowerCase() === link.toLowerCase())) return alert('⚠️ عذراً، هذا الرابط موجود مسبقاً!');
      if (groups.some(group => group.name.toLowerCase() === name.toLowerCase() && name !== 'اسم المجموعة')) return alert('⚠️ عذراً، يوجد مجموعة بهذا الاسم مسبقاً!');

      groups.push({ id: Date.now(), name: name, link: link, done: false, favorite: false });
      saveGroupsData(); renderList();
      linkInput.value = ''; nameInput.value = '';
    }

    function setFilter(filterType) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-tabs button').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab-' + filterType).classList.add('active');
      renderList();
    }

    function resetProgress() {
      if(groups.length === 0) return;
      showCustomConfirm('هل أنت متأكد من إزالة جميع علامات الصح لبدء النشر من جديد؟', () => {
        groups.forEach(g => g.done = false);
        saveGroupsData();
        renderList();
      });
    }

    function renderList() {
      const listContainer = document.getElementById('groupsList');
      listContainer.innerHTML = '';
      
      const searchTerm = (document.getElementById('searchInput').value || '').toLowerCase();
      
      const doneCount = groups.filter(g => g.done).length;
      document.getElementById('progressCounter').innerHTML = `إنجاز: <span>${doneCount}</span> / ${groups.length}`;
      
      const groupsCountNum = document.getElementById('groupsCountNum');
      if (groupsCountNum) {
        groupsCountNum.textContent = groups.length;
      }

      if (groups.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; color:#B0B3B8; font-size: 14px; padding:10px;">لا توجد مجموعات مضافة بعد.</div>';
        return;
      }

      const filteredGroups = groups.filter(group => {
        const matchesSearch = group.name.toLowerCase().includes(searchTerm);
        let matchesFilter = true;
        if (currentFilter === 'fav') matchesFilter = group.favorite === true;
        if (currentFilter === 'todo') matchesFilter = group.done === false;
        
        return matchesSearch && matchesFilter;
      });

      if (filteredGroups.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; color:#B0B3B8; font-size: 14px; padding:10px;">لا توجد نتائج مطابقة لعملية البحث أو التصفية.</div>';
        return;
      }

      filteredGroups.forEach((group) => {
        const originalIndex = groups.findIndex(g => g.link === group.link);
        const isFav = group.favorite ? '⭐' : '☆';
        const favClass = group.favorite ? 'favorite' : '';
        const item = document.createElement('div');
        
        item.className = `group-item ${group.done ? 'done' : ''} ${favClass}`;
        item.innerHTML = `
          <div class="group-info">
            <span class="group-num">${originalIndex + 1}</span>
            <span class="group-favorite" onclick="toggleFavorite(${originalIndex})" title="تمييز كمفضلة">${isFav}</span>
            <input type="checkbox" ${group.done ? 'checked' : ''} onchange="toggleDone(${originalIndex}, this.checked)">
            <span class="group-name">${group.name}</span>
          </div>
          <div class="group-actions">
            <button class="btn-open" onclick="openGroup('${group.link}')">فتح</button>
            <button class="btn-delete" onclick="deleteGroup(${originalIndex})">حذف</button>
          </div>
        `;
        listContainer.appendChild(item);
      });
    }

    function toggleDone(index, isChecked) { groups[index].done = isChecked; saveGroupsData(); renderList(); }
    function toggleFavorite(index) { groups[index].favorite = !groups[index].favorite; saveGroupsData(); renderList(); }
    function openGroup(link) { window.open(link, '_blank'); }
    function deleteGroup(index) { 
      showCustomConfirm('هل أنت متأكد من حذف هذه المجموعة؟', () => {
        groups.splice(index, 1); saveGroupsData(); renderList();
      }); 
    }

    function showCustomConfirm(message, onConfirm, onCancel) {
      const overlay = document.createElement('div');
      overlay.className = 'custom-modal-overlay';
      
      overlay.innerHTML = `
        <div class="custom-modal">
          <div class="custom-modal-title">${message.replace(/\n/g, '<br>')}</div>
          <div class="custom-modal-buttons">
            <button class="custom-modal-btn modal-btn-cancel" id="modalCancelBtn">إلغاء</button>
            <button class="custom-modal-btn modal-btn-confirm" id="modalConfirmBtn">موافق</button>
          </div>
        </div>
      `;

      document.body.appendChild(overlay);

      document.getElementById('modalConfirmBtn').onclick = function() {
        overlay.remove();
        if (onConfirm) onConfirm();
      };

      document.getElementById('modalCancelBtn').onclick = function() {
        overlay.remove();
        if (onCancel) onCancel();
      };

      overlay.onclick = function(e) {
        if (e.target === overlay) {
          overlay.remove();
          if (onCancel) onCancel();
        }
      };
    }

    window.onload = function() {
      const savedText = localStorage.getItem('savedPostText');
      const editor = document.getElementById('postEditor');
      if (savedText) { editor.value = savedText; autoResize(editor); }
      
      // جلب البيانات من سحابة Firebase فور فتح التطبيق
      loadGroupsFromCloud();
      
      document.getElementById('currentYear').textContent = new Date().getFullYear();
    };
  </script>
</body>
</html>
